spring.application.name=sw_engineering
server.port=8080

# Repository backing the API: "memory" (default) uses InMemoryItemRepository.
# Switch to "jpa" once a JPA-backed ItemRepository implementation is added.
app.repository.type=memory

# Origin allowed to call /api/** during local development (Vite dev server).
app.cors.allowed-origin=http://localhost:5173
